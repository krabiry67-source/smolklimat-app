name: Build APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Keystore
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
      - name: Build
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/android/release.jks', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          [ -z "$KEYSTORE_FILE" ] && unset KEYSTORE_FILE
          gradle assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/smolklimat-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: smolklimat-apk, path: android/out/*.apk }
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with: { files: android/out/*.apk }
