name: Build APK
# Сборка запускается сама, когда вы публикуете релиз на GitHub (тег вида v1.0.4).
# Версия приложения берётся из тега: v1.0.4 → versionName 1.0.4, versionCode 10004.
# APK прикрепляется к этому же релизу — кнопка «Обновить» в приложении сразу его видит.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Version from tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ] && TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v1.0.0)"
          NAME="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Версия $NAME (code $CODE)"
      - name: Keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "KEYSTORE_FILE=${{ github.workspace }}/android/release.jks" >> "$GITHUB_ENV"
            echo "Keystore: production key loaded"
          else
            echo "Keystore: secret not set, using debug key"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/smolklimat-${VERSION_NAME}.apk"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with: { name: smolklimat-apk, path: android/out/*.apk }
      - name: Attach APK to release
        if: steps.ver.outputs.tag != '' && (github.event_name == 'release' || github.ref_type == 'tag')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: android/out/*.apk
